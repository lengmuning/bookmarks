<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmarks Sync</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <h1>🔄 Bookmarks Sync</h1>

    <div id="status-paired" class="hidden">
      <div class="status-badge paired">Connected</div>
      <p class="info">Receiving Safari bookmarks in real-time.</p>
      <p class="detail">Pair ID: <code id="pair-id-display"></code></p>
      <p class="detail">Last sync: <span id="last-sync">Never</span></p>
      <button id="btn-sync-now" class="btn primary">Sync Now</button>
      <button id="btn-unpair" class="btn secondary">Disconnect</button>
    </div>

    <div id="status-unpaired" class="hidden">
      <div class="status-badge unpaired">Not Connected</div>
      <p class="info">Enter the pairing code from your Safari extension.</p>
      <label for="pair-code">Pairing Code:</label>
      <input type="text" id="pair-code" maxlength="6" placeholder="000000" class="code-input">
      <label for="api-url">Worker URL:</label>
      <input type="text" id="api-url" placeholder="https://your-worker.workers.dev">
      <button id="btn-join" class="btn primary">Connect</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
